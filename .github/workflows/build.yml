name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # sherpa-rs-sys downloads prebuilt onnx libs into its OUT_DIR;
          # the default cache cleanup prunes them while keeping the build
          # fingerprint, which poisons later runs with LNK1181
          cache-all-crates: "true"

      - name: Core unit tests
        run: cargo test -p yapping-core

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build installer
        run: npx --yes "@tauri-apps/cli@2" build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Yapping-Setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
