name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # Never cache the target dir: sherpa-rs-sys downloads prebuilt
          # onnx libs into its OUT_DIR and the cache cleanup prunes them
          # while keeping the fingerprint, so every cache-restored build
          # dies at link time (LNK1181 cargs.lib). Registry caching alone
          # is safe and still saves the dependency downloads.
          cache-targets: "false"

      - name: Core unit tests
        run: cargo test -p yapping-core

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # sherpa-rs links against prebuilt shared libs that live in the
      # build out-dir; the bundler only packs the exe, so the installed
      # app dies at launch with "sherpa-onnx-c-api.dll was not found".
      # Compile first, harvest every DLL the build produced, and let the
      # resources mapping in tauri.conf.json place them next to the exe.
      # The committed zero-byte placeholder.dll keeps the resources glob
      # valid before this step has run; it is deleted here so only real
      # DLLs ship.
      - name: Stage sherpa DLLs
        shell: pwsh
        run: |
          cargo build --release
          # sherpa-rs-sys copies its shared libs to the top of the
          # profile dir (target/release/*.dll), not the build subtree
          Get-ChildItem -Path target/release -Filter *.dll | Copy-Item -Destination src-tauri/libs -Force
          Remove-Item src-tauri/libs/placeholder.dll
          Get-ChildItem src-tauri/libs

      - name: Build installer
        run: npx --yes "@tauri-apps/cli@2" build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Yapping-Setup
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
